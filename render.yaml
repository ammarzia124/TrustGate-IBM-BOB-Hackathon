services:
  - type: web
    name: trustgate-api
    runtime: python
    plan: free
    # Render runs buildCommand and startCommand with cwd = rootDir, so the paths below stay
    # relative to trustgate/ and the commands are unchanged by the folder restructure.
    # Exactly one level of nesting: rootDir is trustgate/, the command then cds into backend/.
    rootDir: trustgate
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: backend
      # Primary provider first, Groq second. Both keys are `sync: false` — you paste the value
      # into the Render dashboard by hand. Nothing secret is ever written to this file.
      - key: WATSONX_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: WATSONX_MODEL
        value: ibm/granite-4-h-small
      # watsonx.ai scopes a request to a project or a space. Set one of these to a non-secret
      # ID from your watsonx.ai account; without one the engine drops IBM and logs why.
      - key: WATSONX_PROJECT_ID
        sync: false
      # Guards POST /api/runs, which is the only way run records reach a deployed instance --
      # the engine writes them to the disk of whatever machine ran it, which for CI is a
      # throwaway runner. Paste the value into the Render dashboard; never into this file.
      #
      # It MUST be declared here and not only in the dashboard. A blueprint is authoritative:
      # every deploy rewrites the service's environment from this list, so a key added by hand
      # and not listed below is silently dropped on the next redeploy. That is exactly what
      # happened -- the token was set, the service was redeployed, and POST /api/runs went
      # back to answering 503 "ingest is not configured on this instance".
      - key: TRUSTGATE_INGEST_TOKEN
        sync: false
